name: Validate HStack skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  skill-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate skill frontmatter, routes, and links
        run: node scripts/validate-skills.mjs
