name: Validate HStack skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  skill-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate skills, payloads, links, and deterministic regressions
        run: bash scripts/validate-repo.sh
